<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Penguin Stopwatch🐧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="website icon" href="icon.png" type="image/x-icon">
  <link rel="canonical" href="https://medpeace.pages.dev/">
</head>

<body>
  <div id="bg"></div>
  <div id="veil"></div>
  <button id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="menu">☰</button>
  <nav id="menu" aria-label="Main navigation" aria-hidden="true">
    <h2>🐧 Penguin</h2>
    <a href="../../index.html"><button data-nav="timer"> Home</button></a>
    <button data-nav="timer">Stopwatch</button>
    <button data-nav="history">Study History</button><button data-nav="stats">Statistics</button>
    <button data-nav="settings">Settings</button><button data-act="wall">Change Wallpaper</button>
    <button data-act="resetTheme">Reset Customization</button><button data-nav="about">About Penguin Stopwatch</button>
  </nav>
  <div id="scrim"></div>
  <main>
    <section id="v-timer" class="view">
      <div class="status" id="status">READY</div>
      <div class="main-time" id="main">00:00</div>
      <div class="current-row">Current: <span id="lap">00:00</span></div>
      <div class="info" id="info"></div>
      <div class="actions">
        <button class="btn primary" id="startBtn">Start</button>
        <button class="btn" id="breakBtn">Take a Break</button>
        <button class="btn" id="lapBtn">Lap</button>
        <button class="btn" id="fsBtn" aria-label="Fullscreen">⛶</button>
      </div>
      <button class="btn end" id="endBtn">End Study Session</button>
    </section>
    <section id="v-page" class="view page" hidden></section>
  </main>
  <dialog id="dlg"></dialog>
  <div id="toast" role="status"></div>
  <script src="js/storage.js"></script>
  <script src="js/stopwatch.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/wallpaper.js"></script>
  <script src="js/sessions.js"></script>
  <script src="js/statistics.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
