  <script defer src="../js/supabase-client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      'use strict';
      const $ = id => document.getElementById(id);
      const grid = $('subjects-grid');
      const never = new Promise(() => { });                       // halts the script after a redirect

      const goLogin = () => {
        const next = 'student/course.html' + location.search;
        location.replace('../login.html?next=' + encodeURIComponent(next));
        return never;
      };
      const message = (el, text) => {                              // text only, never HTML
        const p = document.createElement('p');
        p.className = 'state-msg';
        p.textContent = text;
        el.replaceChildren(p);
      };

      if (typeof supabaseClient === 'undefined' || !supabaseClient) {
        $('course-title').textContent = 'Site not configured';
        return;
      }

      // ---- Logout (this device only) ----
      $('logout-btn').addEventListener('click', async () => {
        try { await supabaseClient.auth.signOut({ scope: 'local' }); } catch (e) { console.error(e); }
        location.replace('../login.html');
      });

      // ---- Must be signed in ----
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) return goLogin();

      // ---- Must have a sensible ?id= ----
      const courseId = new URLSearchParams(location.search).get('id');
      if (!courseId || !/^[A-Za-z0-9-]{1,64}$/.test(courseId)) {
        location.replace('resources.html');
        return never;
      }

      // ---- Course + subjects in parallel (RLS decides what this student may see) ----
      const [courseRes, subjectsRes] = await Promise.all([
        supabaseClient.from('courses').select('id, title, description').eq('id', courseId).maybeSingle(),
        supabaseClient.from('subjects').select('id, title, description').eq('course_id', courseId).order('display_order')
      ]);

      const authFailed = r => r.error && (r.error.code === 'PGRST301' || /jwt/i.test(r.error.message || ''));
      if (authFailed(courseRes) || authFailed(subjectsRes)) { await supabaseClient.auth.signOut({ scope: 'local' }); return goLogin(); }

      if (courseRes.error) {
        console.error(courseRes.error);
        $('course-title').textContent = 'Could not load this course';
        message(grid, 'Check your connection and refresh the page.');
        return;
      }
      if (!courseRes.data) {                                        // missing, unpublished, or another year's course
        $('course-title').textContent = 'Course not available';
        $('course-desc').textContent = 'This course does not exist or is not available for your academic year.';
        grid.replaceChildren();
        return;
      }

      const course = courseRes.data;
      document.title = course.title + ' - MEDPEACE';
      $('course-title').textContent = course.title;
      $('course-desc').textContent = course.description || '';

      if (subjectsRes.error) {
        console.error(subjectsRes.error);
        message(grid, 'Could not load subjects. Please refresh the page.');
        return;
      }
      const subjects = subjectsRes.data || [];
      if (!subjects.length) { message(grid, 'No subjects added yet.'); return; }

      // ---- Build cards with textContent (a title can never inject HTML) ----
      const frag = document.createDocumentFragment();
      for (const s of subjects) {
        const card = document.createElement('div');
        card.className = 'course-card';

        const h3 = document.createElement('h3');
        h3.textContent = s.title;

        const p = document.createElement('p');
        p.textContent = s.description || 'Explore lectures, books, and MCQs.';

        const a = document.createElement('a');
        a.className = 'course-link';
        a.href = 'subject.html?id=' + encodeURIComponent(s.id);
        a.textContent = 'View Content →';

        card.append(h3, p, a);
        frag.append(card);
      }
      grid.replaceChildren(frag);
    });
  </script>
