<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Account - MEDPEACE</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070B14">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/account.css">
</head>
<body class="guard-pending">
  <header class="nav student-nav">
    <div class="wrap">
      <a class="logo" href="../index.html" aria-label="MEDPEACE home">
        <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#16233B"/><path d="M10 29V15l10 10 10-10v14" fill="none" stroke="#CFE3F8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="10.5" r="2.2" fill="#8FC8F0"/></svg>
        <span class="word">MED<b>PEACE</b></span>
      </a>
      <nav class="links" aria-label="Student">
        <a href="dashboard.html">Dashboard</a>
        <a href="resources.html">Resources</a>
        <a href="account.html" aria-current="page">Account</a>
        <button type="button" id="logout-btn" class="pill">Log Out</button>
      </nav>
    </div>
  </header>

  <main class="wrap acc-main">
    <h1>My Account</h1>

    <div class="acc-grid">
      <section class="acc-card" aria-labelledby="profile-title">
        <h2 id="profile-title">Profile Details</h2>
        <dl class="acc-list">
          <div><dt>Name</dt><dd id="acc-name">…</dd></div>
          <div><dt>Email</dt><dd id="acc-email">…</dd></div>
          <div><dt>University ID</dt><dd id="acc-uid">…</dd></div>
          <div><dt>Academic Year</dt><dd id="acc-year">…</dd></div>
        </dl>
      </section>

      <section class="acc-card" aria-labelledby="pw-title">
        <h2 id="pw-title">Change Password</h2>
        <form id="pw-form" class="acc-form" novalidate>
          <!-- lets password managers save the new password against the right account -->
          <input type="email" id="pw-username" class="sr-only" autocomplete="username" tabindex="-1" aria-hidden="true" readonly>

          <div id="pw-msg" class="acc-msg" role="status" aria-live="polite" hidden></div>

          <div class="acc-field">
            <label for="current-password">Current password</label>
            <div class="pw">
              <input type="password" id="current-password" autocomplete="current-password">
              <button type="button" class="pw-toggle" data-toggle="current-password" aria-pressed="false">Show</button>
            </div>
          </div>

          <div class="acc-field">
            <label for="new-password">New password</label>
            <div class="pw">
              <input type="password" id="new-password" autocomplete="new-password" aria-describedby="pw-hint">
              <button type="button" class="pw-toggle" data-toggle="new-password" aria-pressed="false">Show</button>
            </div>
            <p class="acc-hint" id="pw-hint">At least 8 characters, with upper-case, lower-case and a number.</p>
          </div>

          <div class="acc-field">
            <label for="confirm-password">Confirm new password</label>
            <div class="pw">
              <input type="password" id="confirm-password" autocomplete="new-password">
              <button type="button" class="pw-toggle" data-toggle="confirm-password" aria-pressed="false">Show</button>
            </div>
          </div>

          <button type="submit" id="update-pw-btn" class="btn-solid">Update password</button>
        </form>
      </section>
    </div>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script defer src="../js/supabase-client.js"></script>
  <script defer src="../js/student-common.js"></script>
  <script defer src="../js/account.js"></script>
</body>
</html>
