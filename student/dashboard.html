<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard - MEDPEACE</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070B14">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/home.css"> <!-- nav + .icon styles -->
  <link rel="stylesheet" href="../css/dashboard.css">
  <style>
    /* Small page-level fixes. Safe to move into dashboard.css later. */
    button.pill { border: 0; font: inherit; font-weight: 600; cursor: pointer; }
    .student-nav .links a[aria-current="page"] { color: var(--frost); }
    .quick-card .icon { margin-bottom: .8rem; }

    /* home.css hides every non-pill nav link on phones; students still need theirs */
    @media (max-width: 720px) {
      .student-nav .links { gap: .9rem; }
      .student-nav .links a:not(.pill) { display: inline; font-size: .82rem; }
      .student-nav .links .nav-extra { display: none; }   /* Stopwatch is also in Quick Actions */
      .student-nav .word { display: none; }
      .student-nav .pill { padding: .45rem .9rem; font-size: .82rem; }
    }
  </style>
</head>
<body>
  <!-- Top Navigation -->
  <header class="nav student-nav">
    <div class="wrap">
      <a class="logo" href="../index.html" aria-label="MEDPEACE home">
        <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#16233B"/><path d="M10 29V15l10 10 10-10v14" fill="none" stroke="#CFE3F8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="10.5" r="2.2" fill="#8FC8F0"/></svg>
        <span class="word">MED<b>PEACE</b></span>
      </a>
      <nav class="links" aria-label="Student">
        <a href="dashboard.html" aria-current="page">Dashboard</a>
        <a href="resources.html">Resources</a>
        <a href="account.html">Account</a>
        <a class="nav-extra" href="../tools/penguin-stopwatch/index.html">Stopwatch</a>
        <button type="button" id="logout-btn" class="pill">Log Out</button>
      </nav>
    </div>
  </header>

  <main class="wrap dashboard-main">
    <!-- Welcome Section -->
    <section class="welcome-section" aria-labelledby="welcome-title">
      <h1 id="welcome-title">Welcome back, <span id="student-name">…</span></h1>
      <p>You are currently viewing resources for <strong id="student-year">…</strong>.</p>
    </section>

    <!-- Quick Links -->
    <section class="quick-links" aria-labelledby="quick-title">
      <h2 id="quick-title">Quick Actions</h2>
      <div class="quick-grid">
        <a href="resources.html" class="quick-card">
          <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5zM4 18.5V5.5"/></svg></span>
          <h3>Resources Library</h3>
          <p>Access all your courses and lectures.</p>
        </a>
        <a href="../tools/penguin-stopwatch/index.html" class="quick-card">
          <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5"/></svg></span>
          <h3>Penguin Stopwatch</h3>
          <p>Start a focused study session.</p>
        </a>
      </div>
    </section>

    <!-- Courses Preview -->
    <section class="courses-section" aria-labelledby="courses-title">
      <div class="section-head">
        <h2 id="courses-title">Your Courses</h2>
        <a href="resources.html" class="view-all">View All →</a>
      </div>
      <div class="course-grid" id="dashboard-courses" aria-live="polite">
        <!-- Courses will be injected here by JS -->
      </div>
      <noscript><p>JavaScript is required to load your courses.</p></noscript>
    </section>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script defer src="../js/supabase-client.js"></script>
  <script defer src="../js/student.js"></script>
</body>
</html>
