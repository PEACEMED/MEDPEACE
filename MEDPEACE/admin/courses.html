<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage Courses - MEDPEACE Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="logo" href="../index.html">
        <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#16233B"/><path d="M10 29V15l10 10 10-10v14" fill="none" stroke="#CFE3F8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="10.5" r="2.2" fill="#8FC8F0"/></svg>
        <span class="word">MED<b>PEACE</b> <span style="font-size: 10px; background: #ff6b6b; color: white; padding: 2px 6px; border-radius: 4px; margin-left: 5px; letter-spacing: normal;">ADMIN</span></span>
      </a>
      <nav class="links">
        <a href="dashboard.html">Overview</a>
        <a href="courses.html" style="color: var(--frost)">Manage Courses</a>
        <button id="logout-btn" class="pill" style="border:none; cursor:pointer;">Log Out</button>
      </nav>
    </div>
  </header>

  <main class="wrap admin-main">
    <header class="admin-header">
      <h1>Manage Courses</h1>
      <button class="btn-add" id="btn-add-course">+ Add New Course</button>
    </header>

    <div class="admin-table-container">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Order</th>
            <th>Course Title</th>
            <th>Year</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="courses-table-body">
          <tr><td colspan="5" style="text-align: center;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Course Modal -->
  <div class="modal-overlay" id="course-modal">
    <div class="modal-content">
      <h2 id="modal-title">Add Course</h2>
      <form id="course-form">
        <input type="hidden" id="course-id">
        <div class="form-group">
          <label>Course Title</label>
          <input type="text" id="course-title" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="course-desc"></textarea>
        </div>
        <div class="form-group">
          <label>Academic Year</label>
          <select id="course-year" required>
            <option value="1">First Year</option>
            <option value="2">Second Year</option>
            <option value="3">Third Year</option>
            <option value="4">Fourth Year</option>
            <option value="5">Fifth Year</option>
            <option value="6">Sixth Year</option>
          </select>
        </div>
        <div class="form-group">
          <label>Display Order (e.g., 1, 2, 3)</label>
          <input type="number" id="course-order" value="1" required>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="course-published" style="width: auto; margin-right: 8px;">
            Published (Visible to students)
          </label>
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="submit" class="btn-add" style="flex: 1;">Save Course</button>
          <button type="button" class="action-btn" id="btn-close-modal" style="flex: 1; padding: 0.8rem;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const session = await AdminAuth.checkAuth();
      if (!session) return;
      AdminAuth.setupLogout();

      const modal = document.getElementById('course-modal');
      const form = document.getElementById('course-form');
      const tableBody = document.getElementById('courses-table-body');
      const btnAdd = document.getElementById('btn-add-course');
      const btnClose = document.getElementById('btn-close-modal');

      const yearNames = { 1: 'First', 2: 'Second', 3: 'Third', 4: 'Fourth', 5: 'Fifth', 6: 'Sixth' };

      // Load Courses
      async function loadCourses() {
        const { data: courses, error } = await supabaseClient.from('courses').select('*').order('academic_year').order('display_order');
        if (error) { console.error(error); return; }

        if (courses.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No courses found. Create one!</td></tr>';
          return;
        }

        tableBody.innerHTML = courses.map(c => `
          <tr>
            <td>${c.display_order}</td>
            <td>${c.title}</td>
            <td>${yearNames[c.academic_year]}</td>
            <td><span style="color: ${c.is_published ? '#7be0ff' : '#ff9b9b'}">${c.is_published ? 'Published' : 'Draft'}</span></td>
            <td>
              <a href="subjects.html?id=${c.id}" class="action-btn" style="text-decoration:none;">Manage Subjects</a>
              <button class="action-btn" onclick="editCourse('${c.id}')">Edit</button>
              <button class="action-btn danger" onclick="deleteCourse('${c.id}')">Delete</button>
            </td>
          </tr>
        `).join('');
        
        // Store courses globally for edit function
        window.allCourses = courses;
      }

      // Open Modal for Add
      btnAdd.addEventListener('click', () => {
        document.getElementById('modal-title').textContent = 'Add Course';
        form.reset();
        document.getElementById('course-id').value = '';
        modal.classList.add('active');
      });

      // Close Modal
      btnClose.addEventListener('click', () => modal.classList.remove('active'));

      // Handle Form Submit (Add/Edit)
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('course-id').value;
        const payload = {
          title: document.getElementById('course-title').value,
          description: document.getElementById('course-desc').value,
          academic_year: parseInt(document.getElementById('course-year').value),
          display_order: parseInt(document.getElementById('course-order').value),
          is_published: document.getElementById('course-published').checked
        };

        if (id) {
          // Update
          const { error } = await supabaseClient.from('courses').update(payload).eq('id', id);
          if (error) alert(error.message);
        } else {
          // Insert
          const { error } = await supabaseClient.from('courses').insert([payload]);
          if (error) alert(error.message);
        }

        modal.classList.remove('active');
        loadCourses();
      });

      // Global functions for inline onclick
      window.editCourse = (id) => {
        const c = window.allCourses.find(x => x.id === id);
        if (!c) return;
        document.getElementById('modal-title').textContent = 'Edit Course';
        document.getElementById('course-id').value = c.id;
        document.getElementById('course-title').value = c.title;
        document.getElementById('course-desc').value = c.description || '';
        document.getElementById('course-year').value = c.academic_year;
        document.getElementById('course-order').value = c.display_order;
        document.getElementById('course-published').checked = c.is_published;
        modal.classList.add('active');
      };

      window.deleteCourse = async (id) => {
        if (!confirm('Are you sure? This will delete the course AND all its lectures!')) return;
        const { error } = await supabaseClient.from('courses').delete().eq('id', id);
        if (error) alert(error.message);
        else loadCourses();
      };

      loadCourses();
    });
  </script>
</body>
</html>
