<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage Lecturers - MEDPEACE Admin</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="logo" href="../index.html"><span class="word">MED<b>PEACE</b> ADMIN</span></a>
      <nav class="links">
        <a href="dashboard.html">Overview</a>
        <a href="courses.html" style="color: var(--frost)">Manage Courses</a>
        <button id="logout-btn" class="pill" style="border:none; cursor:pointer;">Log Out</button>
      </nav>
    </div>
  </header>

  <main class="wrap admin-main">
    <a href="javascript:history.back()" style="color: var(--ice); text-decoration: none; margin-bottom: 1rem; display: inline-block;">← Back to Subjects</a>
    
    <header class="admin-header">
      <h1 id="page-title">Lecturers for...</h1>
      <button class="btn-add" id="btn-add-lecturer">+ Add Lecturer</button>
    </header>

    <div class="admin-table-container">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Order</th>
            <th>Lecturer Name</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="lecturers-table-body"></tbody>
      </table>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="lecturer-modal">
    <div class="modal-content">
      <h2>Lecturer Details</h2>
      <form id="lecturer-form">
        <input type="hidden" id="lecturer-id">
        <div class="form-group">
          <label>Doctor's Name</label>
          <input type="text" id="lecturer-name" required placeholder="e.g., Mohamed Fayez">
        </div>
        <div class="form-group">
          <label>Display Order</label>
          <input type="number" id="lecturer-order" value="1" required>
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="submit" class="btn-add" style="flex: 1;">Save</button>
          <button type="button" class="action-btn close-modal" style="flex: 1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const session = await AdminAuth.checkAuth();
      if (!session) return;
      AdminAuth.setupLogout();

      const subjectId = new URLSearchParams(window.location.search).get('subject_id');
      if (!subjectId) { window.location.href = 'courses.html'; return; }

      const modal = document.getElementById('lecturer-modal');
      const form = document.getElementById('lecturer-form');
      const tableBody = document.getElementById('lecturers-table-body');
      let allLecturers = [];

      const { data: subject } = await supabaseClient.from('subjects').select('title').eq('id', subjectId).single();
      if (subject) document.getElementById('page-title').textContent = `Lecturers: ${subject.title}`;

      async function loadLecturers() {
        const { data } = await supabaseClient.from('lecturers').select('*').eq('subject_id', subjectId).order('display_order');
        allLecturers = data || [];
        tableBody.innerHTML = allLecturers.length ? allLecturers.map(l => `
          <tr>
            <td>${l.display_order}</td>
            <td>Dr. ${l.name}</td>
            <td>
              <a href="playlists.html?lecturer_id=${l.id}" class="action-btn" style="text-decoration:none;">Manage Playlists</a>
              <button class="action-btn" onclick="editLec('${l.id}')">Edit</button>
              <button class="action-btn danger" onclick="delLec('${l.id}')">Delete</button>
            </td>
          </tr>
        `).join('') : '<tr><td colspan="3" style="text-align:center;">No lecturers yet.</td></tr>';
      }

      document.querySelectorAll('.close-modal').forEach(b => b.onclick = () => modal.classList.remove('active'));
      document.getElementById('btn-add-lecturer').onclick = () => { form.reset(); document.getElementById('lecturer-id').value = ''; modal.classList.add('active'); };

      form.onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('lecturer-id').value;
        const payload = { subject_id: subjectId, name: document.getElementById('lecturer-name').value, display_order: parseInt(document.getElementById('lecturer-order').value) };
        
        if (id) await supabaseClient.from('lecturers').update(payload).eq('id', id);
        else await supabaseClient.from('lecturers').insert([payload]);
        
        modal.classList.remove('active'); loadLecturers();
      };

      window.editLec = (id) => {
        const l = allLecturers.find(x => x.id === id);
        document.getElementById('lecturer-id').value = l.id; document.getElementById('lecturer-name').value = l.name;
        document.getElementById('lecturer-order').value = l.display_order; modal.classList.add('active');
      };
      window.delLec = async (id) => { if(confirm('Delete this lecturer and all their playlists?')) { await supabaseClient.from('lecturers').delete().eq('id', id); loadLecturers(); } };

      loadLecturers();
    });
  </script>
</body>
</html>
