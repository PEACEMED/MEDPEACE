<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage Resources - MEDPEACE Admin</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="logo" href="../index.html"><span class="word">MED<b>PEACE</b> ADMIN</span></a>
      <nav class="links">
        <a href="dashboard.html">Overview</a>
        <a href="courses.html" style="color: var(--frost)">Manage Courses</a>
        <button id="logout-btn" class="pill" style="border:none; cursor:pointer;">Log Out</button>
      </nav>
    </div>
  </header>

  <main class="wrap admin-main">
    <a href="javascript:history.back()" style="color: var(--ice); text-decoration: none; margin-bottom: 1rem; display: inline-block;">← Back to Subjects</a>
    
    <header class="admin-header">
      <h1 id="page-title">Books & MCQs for...</h1>
      <button class="btn-add" id="btn-add-resource">+ Add Resource</button>
    </header>

    <div class="admin-table-container">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Type</th>
            <th>Title</th>
            <th>Link</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="resources-table-body"></tbody>
      </table>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="resource-modal">
    <div class="modal-content">
      <h2>Resource Details</h2>
      <form id="resource-form">
        <input type="hidden" id="resource-id">
        <div class="form-group">
          <label>Resource Type</label>
          <select id="resource-type" required>
            <option value="book">📚 Book / PDF</option>
            <option value="mcq">📝 MCQs / Questions</option>
          </select>
        </div>
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="resource-title" required placeholder="e.g., Snell's Anatomy PDF">
        </div>
        <div class="form-group">
          <label>URL (Google Drive, Telegram, etc.)</label>
          <input type="url" id="resource-url" required placeholder="https://...">
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="submit" class="btn-add" style="flex: 1;">Save</button>
          <button type="button" class="action-btn close-modal" style="flex: 1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const session = await AdminAuth.checkAuth();
      if (!session) return;
      AdminAuth.setupLogout();

      const subjectId = new URLSearchParams(window.location.search).get('subject_id');
      if (!subjectId) { window.location.href = 'courses.html'; return; }

      const modal = document.getElementById('resource-modal');
      const form = document.getElementById('resource-form');
      const tableBody = document.getElementById('resources-table-body');
      let allResources = [];

      // Fetch Subject Name for the header
      const { data: subject } = await supabaseClient.from('subjects').select('title').eq('id', subjectId).single();
      if (subject) document.getElementById('page-title').textContent = `Books & MCQs: ${subject.title}`;

      // Load Resources
      async function loadResources() {
        const { data } = await supabaseClient.from('resources').select('*').eq('subject_id', subjectId);
        allResources = data || [];
        
        tableBody.innerHTML = allResources.length ? allResources.map(r => `
          <tr>
            <td>${r.type === 'book' ? '📚 Book' : '📝 MCQs'}</td>
            <td>${r.title}</td>
            <td><a href="${r.url}" target="_blank" style="color:var(--ice)">Open Link</a></td>
            <td>
              <button class="action-btn" onclick="editRes('${r.id}')">Edit</button>
              <button class="action-btn danger" onclick="delRes('${r.id}')">Delete</button>
            </td>
          </tr>
        `).join('') : '<tr><td colspan="4" style="text-align:center;">No resources added yet.</td></tr>';
      }

      // Modal Logic
      document.querySelectorAll('.close-modal').forEach(b => b.onclick = () => modal.classList.remove('active'));
      
      document.getElementById('btn-add-resource').onclick = () => { 
        form.reset(); 
        document.getElementById('resource-id').value = ''; 
        modal.classList.add('active'); 
      };

      // Save / Edit
      form.onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('resource-id').value;
        const payload = { 
          subject_id: subjectId, 
          type: document.getElementById('resource-type').value, 
          title: document.getElementById('resource-title').value, 
          url: document.getElementById('resource-url').value 
        };
        
        if (id) await supabaseClient.from('resources').update(payload).eq('id', id);
        else await supabaseClient.from('resources').insert([payload]);
        
        modal.classList.remove('active'); 
        loadResources();
      };

      window.editRes = (id) => {
        const r = allResources.find(x => x.id === id);
        document.getElementById('resource-id').value = r.id; 
        document.getElementById('resource-type').value = r.type;
        document.getElementById('resource-title').value = r.title; 
        document.getElementById('resource-url').value = r.url; 
        modal.classList.add('active');
      };

      window.delRes = async (id) => { 
        if(confirm('Delete this resource?')) { 
          await supabaseClient.from('resources').delete().eq('id', id); 
          loadResources(); 
        } 
      };

      loadResources();
    });
  </script>
</body>
</html>
