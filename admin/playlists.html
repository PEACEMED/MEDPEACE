<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage Playlists - MEDPEACE Admin</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="logo" href="../index.html"><span class="word">MED<b>PEACE</b> ADMIN</span></a>
      <nav class="links">
        <a href="dashboard.html">Overview</a>
        <a href="courses.html" style="color: var(--frost)">Manage Courses</a>
        <button id="logout-btn" class="pill" style="border:none; cursor:pointer;">Log Out</button>
      </nav>
    </div>
  </header>

  <main class="wrap admin-main">
    <a href="javascript:history.back()" style="color: var(--ice); text-decoration: none; margin-bottom: 1rem; display: inline-block;">← Back to Lecturers</a>
    
    <header class="admin-header">
      <h1 id="page-title">Playlists for...</h1>
      <button class="btn-add" id="btn-add-playlist">+ Add Playlist</button>
    </header>

    <div class="admin-table-container">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Order</th>
            <th>Playlist Title</th>
            <th>YouTube URL</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="playlists-table-body"></tbody>
      </table>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="playlist-modal">
    <div class="modal-content">
      <h2>Playlist Details</h2>
      <form id="playlist-form">
        <input type="hidden" id="playlist-id">
        <div class="form-group">
          <label>Playlist Title</label>
          <input type="text" id="playlist-title" required placeholder="e.g., Upper Limb Anatomy">
        </div>
        <div class="form-group">
          <label>YouTube URL</label>
          <input type="url" id="playlist-url" required placeholder="https://youtube.com/watch?v=...">
        </div>
        <div class="form-group">
          <label>Display Order</label>
          <input type="number" id="playlist-order" value="1" required>
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="submit" class="btn-add" style="flex: 1;">Save</button>
          <button type="button" class="action-btn close-modal" style="flex: 1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const session = await AdminAuth.checkAuth();
      if (!session) return;
      AdminAuth.setupLogout();

      const lecturerId = new URLSearchParams(window.location.search).get('lecturer_id');
      if (!lecturerId) { window.location.href = 'courses.html'; return; }

      const modal = document.getElementById('playlist-modal');
      const form = document.getElementById('playlist-form');
      const tableBody = document.getElementById('playlists-table-body');
      let allPlaylists = [];

      const { data: lecturer } = await supabaseClient.from('lecturers').select('name').eq('id', lecturerId).single();
      if (lecturer) document.getElementById('page-title').textContent = `Playlists: Dr. ${lecturer.name}`;

      async function loadPlaylists() {
        const { data } = await supabaseClient.from('playlists').select('*').eq('lecturer_id', lecturerId).order('display_order');
        allPlaylists = data || [];
        tableBody.innerHTML = allPlaylists.length ? allPlaylists.map(p => `
          <tr>
            <td>${p.display_order}</td>
            <td>${p.title}</td>
            <td><a href="${p.youtube_url}" target="_blank" style="color:var(--ice)">Preview Link</a></td>
            <td>
              <button class="action-btn" onclick="editPl('${p.id}')">Edit</button>
              <button class="action-btn danger" onclick="delPl('${p.id}')">Delete</button>
            </td>
          </tr>
        `).join('') : '<tr><td colspan="4" style="text-align:center;">No playlists yet.</td></tr>';
      }

      document.querySelectorAll('.close-modal').forEach(b => b.onclick = () => modal.classList.remove('active'));
      document.getElementById('btn-add-playlist').onclick = () => { form.reset(); document.getElementById('playlist-id').value = ''; modal.classList.add('active'); };

      form.onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('playlist-id').value;
        const payload = { lecturer_id: lecturerId, title: document.getElementById('playlist-title').value, youtube_url: document.getElementById('playlist-url').value, display_order: parseInt(document.getElementById('playlist-order').value) };
        
        if (id) await supabaseClient.from('playlists').update(payload).eq('id', id);
        else await supabaseClient.from('playlists').insert([payload]);
        
        modal.classList.remove('active'); loadPlaylists();
      };

      window.editPl = (id) => {
        const p = allPlaylists.find(x => x.id === id);
        document.getElementById('playlist-id').value = p.id; document.getElementById('playlist-title').value = p.title;
        document.getElementById('playlist-url').value = p.youtube_url; document.getElementById('playlist-order').value = p.display_order;
        modal.classList.add('active');
      };
      window.delPl = async (id) => { if(confirm('Delete this playlist?')) { await supabaseClient.from('playlists').delete().eq('id', id); loadPlaylists(); } };

      loadPlaylists();
    });
  </script>
</body>
</html>
