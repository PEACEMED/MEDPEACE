<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage Content - MEDPEACE Admin</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="logo" href="../index.html"><span class="word">MED<b>PEACE</b> ADMIN</span></a>
      <nav class="links">
        <a href="dashboard.html">Overview</a>
        <a href="courses.html" style="color: var(--frost)">Manage Courses</a>
        <button id="logout-btn" class="pill" style="border:none; cursor:pointer;">Log Out</button>
      </nav>
    </div>
  </header>

  <main class="wrap admin-main">
    <a href="javascript:history.back()" style="color: var(--ice); text-decoration: none; margin-bottom: 1rem; display: inline-block;">← Back to Subjects</a>
    
    <header class="admin-header">
      <h1 id="page-title">Content for...</h1>
    </header>

    <!-- Lectures Section -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin: 2rem 0 1rem;">
      <h2 style="color: var(--frost);">Lectures</h2>
      <button class="btn-add" id="btn-add-lecture">+ Add Lecture</button>
    </div>
    
    <div class="admin-table-container" style="margin-bottom: 3rem;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Order</th>
            <th>Lecture Title</th>
            <th>Lecturer</th>
            <th>URL</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="lectures-table-body"></tbody>
      </table>
    </div>

    <!-- Resources Section -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin: 2rem 0 1rem;">
      <h2 style="color: var(--frost);">Books & MCQs</h2>
      <button class="btn-add" id="btn-add-resource">+ Add Resource</button>
    </div>

    <div class="admin-table-container">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Type</th>
            <th>Title</th>
            <th>Link</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="resources-table-body"></tbody>
      </table>
    </div>
  </main>

  <!-- Lecture Modal -->
  <div class="modal-overlay" id="lecture-modal">
    <div class="modal-content">
      <h2>Lecture Details</h2>
      <form id="lecture-form">
        <input type="hidden" id="lecture-id">
        <div class="form-group"><label>Title</label><input type="text" id="lecture-title" required></div>
        <div class="form-group"><label>Lecturer Name</label><input type="text" id="lecture-lecturer" placeholder="Dr. Mohamed Fayez"></div>
        <div class="form-group"><label>YouTube URL</label><input type="url" id="lecture-url" required></div>
        <div class="form-group"><label>Order</label><input type="number" id="lecture-order" value="1" required></div>
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="submit" class="btn-add" style="flex: 1;">Save</button>
          <button type="button" class="action-btn close-modal" style="flex: 1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Resource Modal -->
  <div class="modal-overlay" id="resource-modal">
    <div class="modal-content">
      <h2>Resource Details</h2>
      <form id="resource-form">
        <input type="hidden" id="resource-id">
        <div class="form-group">
          <label>Type</label>
          <select id="resource-type">
            <option value="book">Book / PDF</option>
            <option value="mcq">MCQs / Questions</option>
          </select>
        </div>
        <div class="form-group"><label>Title</label><input type="text" id="resource-title" required></div>
        <div class="form-group"><label>URL (Google Drive, etc.)</label><input type="url" id="resource-url" required></div>
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="submit" class="btn-add" style="flex: 1;">Save</button>
          <button type="button" class="action-btn close-modal" style="flex: 1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const session = await AdminAuth.checkAuth();
      if (!session) return;
      AdminAuth.setupLogout();

      const subjectId = new URLSearchParams(window.location.search).get('subject_id');
      if (!subjectId) { window.location.href = 'courses.html'; return; }

      const { data: subject } = await supabaseClient.from('subjects').select('title').eq('id', subjectId).single();
      document.getElementById('page-title').textContent = `Content: ${subject.title}`;

      // --- Modal Logic ---
      document.querySelectorAll('.close-modal').forEach(b => b.onclick = () => document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')));

      // --- LECTURES ---
      const lModal = document.getElementById('lecture-modal');
      const lForm = document.getElementById('lecture-form');
      const lBody = document.getElementById('lectures-table-body');
      let allLectures = [];

      async function loadLectures() {
        const { data } = await supabaseClient.from('lectures').select('*').eq('subject_id', subjectId).order('display_order');
        allLectures = data || [];
        lBody.innerHTML = allLectures.length ? allLectures.map(l => `
          <tr>
            <td>${l.display_order}</td>
            <td>${l.title}</td>
            <td>${l.lecturer_name || '-'}</td>
            <td><a href="${l.youtube_url}" target="_blank" style="color:var(--ice)">Link</a></td>
            <td>
              <button class="action-btn" onclick="editLec('${l.id}')">Edit</button>
              <button class="action-btn danger" onclick="delLec('${l.id}')">Delete</button>
            </td>
          </tr>
        `).join('') : '<tr><td colspan="5" style="text-align:center;">No lectures yet.</td></tr>';
      }

      document.getElementById('btn-add-lecture').onclick = () => { lForm.reset(); document.getElementById('lecture-id').value = ''; lModal.classList.add('active'); };
      lForm.onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('lecture-id').value;
        const payload = { subject_id: subjectId, title: document.getElementById('lecture-title').value, lecturer_name: document.getElementById('lecture-lecturer').value, youtube_url: document.getElementById('lecture-url').value, display_order: parseInt(document.getElementById('lecture-order').value) };
        if (id) await supabaseClient.from('lectures').update(payload).eq('id', id);
        else await supabaseClient.from('lectures').insert([payload]);
        lModal.classList.remove('active'); loadLectures();
      };

      window.editLec = (id) => {
        const l = allLectures.find(x => x.id === id);
        document.getElementById('lecture-id').value = l.id; document.getElementById('lecture-title').value = l.title;
        document.getElementById('lecture-lecturer').value = l.lecturer_name || ''; document.getElementById('lecture-url').value = l.youtube_url;
        document.getElementById('lecture-order').value = l.display_order; lModal.classList.add('active');
      };
      window.delLec = async (id) => { if(confirm('Delete lecture?')) { await supabaseClient.from('lectures').delete().eq('id', id); loadLectures(); } };

      // --- RESOURCES ---
      const rModal = document.getElementById('resource-modal');
      const rForm = document.getElementById('resource-form');
      const rBody = document.getElementById('resources-table-body');
      let allRes = [];

      async function loadResources() {
        const { data } = await supabaseClient.from('resources').select('*').eq('subject_id', subjectId);
        allRes = data || [];
        rBody.innerHTML = allRes.length ? allRes.map(r => `
          <tr>
            <td>${r.type === 'book' ? '📚 Book' : '📝 MCQs'}</td>
            <td>${r.title}</td>
            <td><a href="${r.url}" target="_blank" style="color:var(--ice)">Open Link</a></td>
            <td>
              <button class="action-btn" onclick="editRes('${r.id}')">Edit</button>
              <button class="action-btn danger" onclick="delRes('${r.id}')">Delete</button>
            </td>
          </tr>
        `).join('') : '<tr><td colspan="4" style="text-align:center;">No resources yet.</td></tr>';
      }

      document.getElementById('btn-add-resource').onclick = () => { rForm.reset(); document.getElementById('resource-id').value = ''; rModal.classList.add('active'); };
      rForm.onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('resource-id').value;
        const payload = { subject_id: subjectId, type: document.getElementById('resource-type').value, title: document.getElementById('resource-title').value, url: document.getElementById('resource-url').value };
        if (id) await supabaseClient.from('resources').update(payload).eq('id', id);
        else await supabaseClient.from('resources').insert([payload]);
        rModal.classList.remove('active'); loadResources();
      };

      window.editRes = (id) => {
        const r = allRes.find(x => x.id === id);
        document.getElementById('resource-id').value = r.id; document.getElementById('resource-type').value = r.type;
        document.getElementById('resource-title').value = r.title; document.getElementById('resource-url').value = r.url; rModal.classList.add('active');
      };
      window.delRes = async (id) => { if(confirm('Delete resource?')) { await supabaseClient.from('resources').delete().eq('id', id); loadResources(); } };

      // Initialize
      loadLectures();
      loadResources();
    });
  </script>
</body>
</html>
